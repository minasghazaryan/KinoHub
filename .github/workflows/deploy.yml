name: Deploy Same Repo to Server

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout current repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Copy project files to server
      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: "."
          target: "/var/www/kino"
          rm: true

      # 3️⃣ Run docker compose on server
      - name: Run Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            cd /var/www/kino
            # Create .env file with secrets
            cat > .env << EOF
            KinopoiskApiKey=${{ secrets.KinopoiskApiKey }}
            Vibix__BearerToken=${{ secrets.Vibix__BearerToken }}
            Vibix__PublisherId=${{ secrets.Vibix__PublisherId }}
            EOF
            docker compose down || true
            docker compose up -d --build

            echo "Deployment completed."
