version: "3.9"

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=KinoHubDb;User Id=sa;Password=KinoHub_Sql_Secret_123;TrustServerCertificate=True;MultipleActiveResultSets=true;
      KinopoiskApiKey: ${KinopoiskApiKey:-}
      Vibix__BearerToken: ${Vibix__BearerToken:-}
      Vibix__PublisherId: ${Vibix__PublisherId:-}
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: KinoHub_Sql_Secret_123
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/1433'"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sqlserver-data:
